<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070B1A" />

    <title>Buyurtma berish — Tinch</title>
    <meta name="description" content="Tinch mahsulotlariga buyurtma va bepul konsultatsiya so'rovi." />
    <meta name="author" content="Tinch" />
    <!-- Forma sahifasi qidiruvda kerak emas, lekin havolalar kuzatilsin -->
    <meta name="robots" content="noindex, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tinch" />
    <meta property="og:title" content="Buyurtma berish — Tinch" />
    <meta property="og:description" content="Formani to'ldiring — 1 ish kuni ichida bog'lanamiz va aniq taklif tayyorlaymiz." />
    <meta property="og:image" content="https://tinch.uz/images/opt/og-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="./images/logo2.png" />
    <link rel="apple-touch-icon" href="./images/logo2.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/tokens.css?v=40b92821" />
    <link rel="stylesheet" href="css/base.css?v=b851f028" />
    <link rel="stylesheet" href="css/components.css?v=5d9c9fa4" />
    <link rel="stylesheet" href="css/pages.css?v=24a8eb54" />
    <!-- JS o'chiq bo'lsa ham bo'limlar ko'rinsin -->
    <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
  </head>

  <body>
    <a class="skip-link" href="#main" data-i18n="ui.skipLink">Asosiy kontentga o'tish</a>

    <header class="site-header" id="siteHeader"></header>

    <main id="main">
      <section class="section">
        <!-- Uch qism: sarlavha, forma, kontaktlar. Kompyuterda forma o'ngda,
             telefonda sarlavhadan keyin darhol forma, kontaktlar pastda. -->
        <div class="container contact-grid contact-grid--order">
          <div class="stack stack-4 reveal contact-grid__intro">
            <span class="eyebrow" data-i18n="order.eyebrow">Buyurtma</span>
            <h1 class="h1" data-i18n="order.title"></h1>
            <p class="lead" data-i18n="order.text"></p>
          </div>

          <div class="form-card reveal contact-grid__form">
            <div id="orderSummary"></div>

            <form id="orderForm" novalidate>
              <div class="form-grid">
                <div class="field">
                  <label for="f-name"><span data-i18n="order.fields.name">Ismingiz</span> <span class="field__req" aria-hidden="true">*</span></label>
                  <input
                    class="input"
                    id="f-name"
                    aria-describedby="f-name-error"
                    name="name"
                    type="text"
                    autocomplete="name"
                    required
                    data-i18n-attr="placeholder:order.fields.namePh"
                  />
                  <span class="field__error" id="f-name-error" hidden></span>
                </div>

                <div class="field">
                  <label for="f-company" data-i18n="order.fields.company">Korxona nomi</label>
                  <input
                    class="input"
                    id="f-company"
                    aria-describedby="f-company-error"
                    name="company"
                    type="text"
                    autocomplete="organization"
                    data-i18n-attr="placeholder:order.fields.companyPh"
                  />
                  <span class="field__error" id="f-company-error" hidden></span>
                </div>

                <div class="field">
                  <label for="f-phone"><span data-i18n="order.fields.phone">Telefon</span> <span class="field__req" aria-hidden="true">*</span></label>
                  <input
                    class="input"
                    id="f-phone"
                    aria-describedby="f-phone-error"
                    name="phone"
                    type="tel"
                    inputmode="tel"
                    autocomplete="tel"
                    required
                    data-i18n-attr="placeholder:order.fields.phonePh"
                  />
                  <span class="field__error" id="f-phone-error" hidden></span>
                </div>

                <div class="field">
                  <label for="f-email" data-i18n="order.fields.email">Email</label>
                  <input
                    class="input"
                    id="f-email"
                    aria-describedby="f-email-error"
                    name="email"
                    type="email"
                    autocomplete="email"
                    data-i18n-attr="placeholder:order.fields.emailPh"
                  />
                  <span class="field__error" id="f-email-error" hidden></span>
                </div>

                <div class="field">
                  <label for="f-product" data-i18n="order.fields.product">Mahsulot</label>
                  <select class="select" id="f-product" name="product"></select>
                </div>

                <div class="field">
                  <label for="f-plan" data-i18n="order.fields.plan">Tarif</label>
                  <select class="select" id="f-plan" name="plan"></select>
                </div>

                <div class="field">
                  <label for="f-employees">Xodimlar soni</label>
                  <input
                    class="input"
                    id="f-employees"
                    name="employees"
                    type="number"
                    min="1"
                    step="1"
                    inputmode="numeric"
                  />
                </div>

                <div class="field field--full">
                  <label for="f-message" data-i18n="order.fields.message">Xabar</label>
                  <textarea
                    class="textarea"
                    id="f-message"
                    name="message"
                    rows="4"
                    data-i18n-attr="placeholder:order.fields.messagePh"
                  ></textarea>
                </div>
              </div>

              <div class="stack stack-4" style="margin-top: var(--space-6)">
                <div id="formStatus" role="status" aria-live="polite"></div>
                <button class="btn btn--primary btn--lg btn--block" type="submit" id="submitBtn">
                  <span data-i18n="order.fields.submit">So'rovni yuborish</span>
                </button>
                <p class="form-note" data-i18n-html="order.consent"></p>
              </div>
            </form>
          </div>

          <div class="contact-list contact-grid__contacts" id="contactList"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>

    <script src="js/data/site.js?v=38b2c373"></script>
    <script src="js/data/products.js?v=f7a0ef1e"></script>
    <script src="js/data/pages.js?v=42747fb5"></script>
    <script src="js/icons.js?v=40216fe8"></script>
    <script src="js/i18n.js?v=9ebda13c"></script>
    <script src="js/render.js?v=00848224"></script>
    <script src="js/app.js?v=929f539a"></script>
    <script src="js/contact-info.js?v=db753ec8"></script>
    <script src="js/order.js?v=eb1ee0c6"></script>
  </body>
</html>
