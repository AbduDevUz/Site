<!DOCTYPE html>
<html lang="ru">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Заказать услуги TINCH SOFT - автоматизация бизнеса в Ташкенте, Узбекистан"
    />
    <link rel="icon" href="./images/logo2.png" />
    <link rel="apple-touch-icon" href="./images/logo2.png" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/contact.css" />
    <title>Заказать услуги - TINCH SOFT</title>
  </head>

  <body>
    <!-- Language Switcher -->
    <div class="language-switcher">
      <a href="#" data-lang="uz" class="lang-link">uz</a> / 
      <a href="#" data-lang="ru" class="lang-link">ru</a>
    </div>
    
    <div class="contact-page">
      <div class="contact-container">
        <!-- Left Section - Service Information -->
        <div class="contact-info">
          <div class="newsletter-prompt" id="newsletterPrompt">ЗАКАЗАТЬ УСЛУГИ</div>
          <h1 class="contact-title" id="serviceTitle">Заказать услуги</h1>
          
          <div class="contact-details">
            <p id="serviceDescription" style="font-size: 18px; line-height: 1.8; margin-bottom: 30px;">
              Выберите услугу для получения подробной информации.
            </p>
            
            <p class="address-phone">Ташкент, Узбекистан, +998(99) 055-37-85</p>
            <p class="hours">
              <span class="weekdays">Пн - Пт: 9:00 - 18:00,</span>
              <span class="weekends">Сб - Вс: 10:00 - 16:00</span>
            </p>
            <p class="email">info@tinch.uz</p>
          </div>

          <div class="follow-section">
            <h2 class="follow-title">Следите за нами</h2>
            <div class="social-icons">
              <a href="#" class="social-icon facebook" aria-label="Facebook">
                <i class="fa fa-facebook"></i>
              </a>
              <a href="#" class="social-icon instagram" aria-label="Instagram">
                <i class="fa fa-instagram"></i>
              </a>
              <a href="#" class="social-icon twitter" aria-label="Twitter">
                <i class="fa fa-twitter"></i>
              </a>
              <a href="#" class="social-icon youtube" aria-label="YouTube">
                <i class="fa fa-youtube"></i>
              </a>
              <a href="#" class="social-icon telegram" aria-label="Telegram">
                <i class="fa fa-telegram"></i>
              </a>
            </div>
          </div>

          <div class="copyright">©2024 Политика конфиденциальности</div>
        </div>

        <!-- Right Section - Contact Form -->
        <div class="contact-form-wrapper">
          <form class="contact-form" id="orderForm">
            <div class="form-group">
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Введите ваше имя"
                class="form-input"
                required
              />
            </div>
            <div class="form-group">
              <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Введите номер телефона"
                class="form-input"
                required
              />
            </div>
            <div class="form-group">
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Введите действительный email адрес"
                class="form-input"
                required
              />
            </div>
            <div class="form-group">
              <textarea
                id="message"
                name="message"
                placeholder="Введите ваше сообщение"
                class="form-textarea"
                rows="5"
                required
              ></textarea>
            </div>
            <button type="submit" class="submit-btn">ОТПРАВИТЬ</button>
          </form>
        </div>
      </div>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/order.js"></script>
  </body>
</html>
