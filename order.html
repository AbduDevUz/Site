<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070B1A" />

    <title>Buyurtma berish — TINCH SOFT</title>
    <meta name="description" content="TINCH SOFT mahsulotlariga buyurtma va bepul konsultatsiya so'rovi." />
    <meta name="author" content="TINCH SOFT" />
    <!-- Forma sahifasi qidiruvda kerak emas, lekin havolalar kuzatilsin -->
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://tinch.uz/order.html" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TINCH SOFT" />
    <meta property="og:title" content="Buyurtma berish — TINCH SOFT" />
    <meta property="og:description" content="Formani to'ldiring — 1 ish kuni ichida bog'lanamiz va aniq taklif tayyorlaymiz." />
    <meta property="og:image" content="https://tinch.uz/images/opt/og-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="./images/logo2.png" />
    <link rel="apple-touch-icon" href="./images/logo2.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>

  <body>
    <a class="skip-link" href="#main">Asosiy kontentga o'tish</a>

    <header class="site-header" id="siteHeader"></header>

    <main id="main">
      <section class="section">
        <div class="container contact-grid">
          <!-- Chap ustun -->
          <div class="stack stack-4 reveal">
            <span class="eyebrow" data-i18n="order.eyebrow">Buyurtma</span>
            <h1 class="h1" data-i18n="order.title"></h1>
            <p class="lead" data-i18n="order.text"></p>

            <div class="contact-list" id="contactList"></div>
          </div>

          <!-- O'ng ustun: forma -->
          <div class="form-card reveal">
            <div id="orderSummary"></div>

            <form id="orderForm" novalidate>
              <div class="form-grid">
                <div class="field">
                  <label for="f-name" data-i18n="order.fields.name">Ismingiz</label>
                  <input
                    class="input"
                    id="f-name"
                    name="name"
                    type="text"
                    autocomplete="name"
                    required
                    data-i18n-attr="placeholder:order.fields.namePh"
                  />
                  <span class="field__error" hidden></span>
                </div>

                <div class="field">
                  <label for="f-company" data-i18n="order.fields.company">Korxona nomi</label>
                  <input
                    class="input"
                    id="f-company"
                    name="company"
                    type="text"
                    autocomplete="organization"
                    data-i18n-attr="placeholder:order.fields.companyPh"
                  />
                  <span class="field__error" hidden></span>
                </div>

                <div class="field">
                  <label for="f-phone" data-i18n="order.fields.phone">Telefon</label>
                  <input
                    class="input"
                    id="f-phone"
                    name="phone"
                    type="tel"
                    inputmode="tel"
                    autocomplete="tel"
                    required
                    data-i18n-attr="placeholder:order.fields.phonePh"
                  />
                  <span class="field__error" hidden></span>
                </div>

                <div class="field">
                  <label for="f-email" data-i18n="order.fields.email">Email</label>
                  <input
                    class="input"
                    id="f-email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    data-i18n-attr="placeholder:order.fields.emailPh"
                  />
                  <span class="field__error" hidden></span>
                </div>

                <div class="field">
                  <label for="f-product" data-i18n="order.fields.product">Mahsulot</label>
                  <select class="select" id="f-product" name="product"></select>
                </div>

                <div class="field">
                  <label for="f-plan" data-i18n="order.fields.plan">Tarif</label>
                  <select class="select" id="f-plan" name="plan"></select>
                </div>

                <div class="field">
                  <label for="f-employees" data-i18n="order.fields.employees">Xodimlar soni</label>
                  <input
                    class="input"
                    id="f-employees"
                    name="employees"
                    type="number"
                    min="1"
                    step="1"
                    inputmode="numeric"
                    data-i18n-attr="placeholder:order.fields.employeesPh"
                  />
                </div>

                <div class="field field--full">
                  <label for="f-message" data-i18n="order.fields.message">Xabar</label>
                  <textarea
                    class="textarea"
                    id="f-message"
                    name="message"
                    rows="4"
                    data-i18n-attr="placeholder:order.fields.messagePh"
                  ></textarea>
                </div>
              </div>

              <div class="stack stack-4" style="margin-top: var(--space-6)">
                <div id="formStatus"></div>
                <button class="btn btn--primary btn--lg btn--block" type="submit" id="submitBtn">
                  <span data-i18n="order.fields.submit">So'rovni yuborish</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>

    <script src="js/data/site.js"></script>
    <script src="js/data/products.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/render.js"></script>
    <script src="js/app.js"></script>
    <script src="js/contact-info.js"></script>
    <script src="js/order.js"></script>
  </body>
</html>
