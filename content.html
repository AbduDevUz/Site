<!DOCTYPE html>
<html lang="ru">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Свяжитесь с TINCH SOFT - автоматизация бизнеса в Ташкенте, Узбекистан"
    />
    <link rel="icon" href="./images/logo2.png" />
    <link rel="apple-touch-icon" href="./images/logo2.png" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/contact.css" />
    <title>Контакты - TINCH SOFT</title>
  </head>

  <body>
    <!-- Language Switcher -->
    <div class="language-switcher">
      <a href="#" data-lang="uz" class="lang-link">uz</a> / 
      <a href="#" data-lang="ru" class="lang-link">ru</a>
    </div>
    
    <div class="contact-page">
      <div class="contact-container">
        <!-- Left Section - Contact Information -->
        <div class="contact-info">
          <div class="newsletter-prompt">JOIN OUR NEWSLETTER</div>
          <h1 class="contact-title">Contact us</h1>
          
          <div class="contact-details">
            <p class="address-phone">3045 10 Sunrize Avenue, 123-456-7890</p>
            <p class="hours">
              <span class="weekdays">Mon - Fri: 9:00 am - 8:00 pm,</span>
              <span class="weekends">Sat - Sun: 9:00 am - 10 pm</span>
            </p>
            <p class="email">contacts@esbnyc.com</p>
          </div>

          <div class="follow-section">
            <h2 class="follow-title">Follow us</h2>
            <div class="social-icons">
              <a href="#" class="social-icon facebook" aria-label="Facebook">
                <i class="fa fa-facebook"></i>
              </a>
              <a href="#" class="social-icon instagram" aria-label="Instagram">
                <i class="fa fa-instagram"></i>
              </a>
              <a href="#" class="social-icon twitter" aria-label="Twitter">
                <i class="fa fa-twitter"></i>
              </a>
              <a href="#" class="social-icon youtube" aria-label="YouTube">
                <i class="fa fa-youtube"></i>
              </a>
            </div>
          </div>

          <div class="copyright">©2021 Privacy policy</div>
        </div>

        <!-- Right Section - Contact Form -->
        <div class="contact-form-wrapper">
          <form class="contact-form" id="contactForm">
            <div class="form-group">
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your Name"
                class="form-input"
                required
              />
            </div>
            <div class="form-group">
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter a valid email address"
                class="form-input"
                required
              />
            </div>
            <div class="form-group">
              <textarea
                id="message"
                name="message"
                placeholder="Enter your message"
                class="form-textarea"
                rows="5"
                required
              ></textarea>
            </div>
            <button type="submit" class="submit-btn">SUBMIT</button>
          </form>
        </div>
      </div>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/contact.js"></script>
  </body>
</html>
