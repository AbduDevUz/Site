<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Tinch Savdo — sotuvlar jadvali va Telegram tasdig'i">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1026"/>
      <stop offset="1" stop-color="#121B3E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#5B5BF5" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5B5BF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.14" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#FFE44D" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFE44D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>

  <!-- ============ Chapda: sotuvlar jadvali ============ -->
  <g transform="translate(72 96)">
    <rect width="600" height="470" rx="22" fill="#0E1531" stroke="rgba(255,255,255,0.10)"/>

    <!-- sarlavha -->
    <text x="34" y="56" font-family="Manrope, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="#EEF1FB">Sotuvlar</text>
    <rect x="34" y="74" width="52" height="3" rx="1.5" fill="#FFE44D"/>

    <!-- jadval sarlavhasi -->
    <g font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#6F7AA0">
      <text x="34"  y="122">Mijoz</text>
      <text x="252" y="122">Olish</text>
      <text x="366" y="122">Sotish</text>
      <text x="486" y="122">Foyda</text>
    </g>
    <rect x="34" y="136" width="532" height="1" fill="rgba(255,255,255,0.09)"/>

    <!-- qatorlar -->
    <g font-family="Inter, Segoe UI, sans-serif" font-size="16">
      <g transform="translate(0 0)">
        <text x="34"  y="178" fill="#EEF1FB">Karim aka</text>
        <text x="252" y="178" fill="#A7B0D0">42 000</text>
        <text x="366" y="178" fill="#A7B0D0">48 000</text>
        <text x="486" y="178" fill="#34D399" font-weight="700">+6 000</text>
      </g>
      <rect x="34" y="200" width="532" height="1" fill="rgba(255,255,255,0.06)"/>

      <g>
        <text x="34"  y="242" fill="#EEF1FB">Anvar Toshev</text>
        <text x="252" y="242" fill="#A7B0D0">38 500</text>
        <text x="366" y="242" fill="#A7B0D0">44 000</text>
        <text x="486" y="242" fill="#34D399" font-weight="700">+5 500</text>
      </g>
      <rect x="34" y="264" width="532" height="1" fill="rgba(255,255,255,0.06)"/>

      <g>
        <text x="34"  y="306" fill="#EEF1FB">Sardor MChJ</text>
        <text x="252" y="306" fill="#A7B0D0">55 000</text>
        <text x="366" y="306" fill="#A7B0D0">61 500</text>
        <text x="486" y="306" fill="#34D399" font-weight="700">+6 500</text>
      </g>
      <rect x="34" y="328" width="532" height="1" fill="rgba(255,255,255,0.06)"/>
    </g>

    <!-- qarz paneli -->
    <g transform="translate(34 356)">
      <rect width="256" height="82" rx="14" fill="rgba(248,113,113,0.10)" stroke="rgba(248,113,113,0.28)"/>
      <text x="20" y="32" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#A7B0D0">Qarzdorlar</text>
      <text x="20" y="62" font-family="Manrope, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#F87171">−4 820 000</text>
    </g>
    <g transform="translate(310 356)">
      <rect width="256" height="82" rx="14" fill="rgba(52,211,153,0.10)" stroke="rgba(52,211,153,0.28)"/>
      <text x="20" y="32" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#A7B0D0">Haqdorlar</text>
      <text x="20" y="62" font-family="Manrope, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#34D399">+1 260 000</text>
    </g>
  </g>

  <!-- ============ O'ngda: Telegram tasdig'i ============ -->
  <g transform="translate(724 150)">
    <rect width="404" height="376" rx="24" fill="#121B3E" stroke="rgba(91,91,245,0.40)"/>

    <!-- bot sarlavhasi -->
    <g transform="translate(28 30)">
      <circle cx="18" cy="18" r="18" fill="#5B5BF5"/>
      <path d="M9.5 18.2 25 11.6c.8-.3 1.5.2 1.2 1.3l-2.6 12.3c-.2.9-.8 1.1-1.5.7l-4-3-1.9 1.9c-.2.2-.4.4-.9.4l.3-4.3 7.7-7c.3-.3-.1-.5-.5-.2l-9.5 6-4.1-1.3c-.9-.3-.9-.9.2-1.3Z" fill="#FFFFFF"/>
      <text x="50" y="16" font-family="Manrope, Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#EEF1FB">Tinch Savdo</text>
      <text x="50" y="34" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#6F7AA0">bot</text>
    </g>

    <!-- xabar -->
    <g transform="translate(28 96)">
      <rect width="348" height="176" rx="16" fill="#0E1531" stroke="rgba(255,255,255,0.09)"/>
      <text x="22" y="34" font-family="Manrope, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#EEF1FB">Yangi sotuv</text>

      <g font-family="Inter, Segoe UI, sans-serif" font-size="14">
        <text x="22"  y="68"  fill="#6F7AA0">Mahsulot</text>
        <text x="200" y="68"  fill="#EEF1FB">Sement M400</text>
        <text x="22"  y="96"  fill="#6F7AA0">Miqdor</text>
        <text x="200" y="96"  fill="#EEF1FB">12 000 kg</text>
        <text x="22"  y="124" fill="#6F7AA0">Summa</text>
        <text x="200" y="124" fill="#FFE44D" font-weight="700">576 000</text>
        <text x="22"  y="152" fill="#6F7AA0">Mashina</text>
        <text x="200" y="152" fill="#EEF1FB">01 A 234 BC</text>
      </g>
    </g>

    <!-- tugmalar -->
    <g transform="translate(28 292)">
      <rect width="168" height="52" rx="14" fill="rgba(52,211,153,0.16)" stroke="rgba(52,211,153,0.45)"/>
      <text x="84" y="33" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#34D399">✓  Tasdiqlash</text>

      <g transform="translate(180 0)">
        <rect width="168" height="52" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)"/>
        <text x="84" y="33" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#A7B0D0">✕  Bekor qilish</text>
      </g>
    </g>
  </g>
</svg>
