<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Tinch Call Center — qo'ng'iroqlar navbati va operatorlar paneli">
  <defs>
    <linearGradient id="cc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1026"/>
      <stop offset="1" stop-color="#121B3E"/>
    </linearGradient>
    <radialGradient id="cc-glow" cx="0.82" cy="0.14" r="0.62">
      <stop offset="0" stop-color="#5B5BF5" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5B5BF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cc-glow2" cx="0.12" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#F8DA00" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#F8DA00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cc-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B5BF5"/>
      <stop offset="1" stop-color="#3F3FD1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#cc-bg)"/>
  <rect width="1200" height="675" fill="url(#cc-glow)"/>
  <rect width="1200" height="675" fill="url(#cc-glow2)"/>

  <!-- Oyna ramkasi -->
  <rect x="64" y="56" width="1072" height="563" rx="22" fill="#0E1531" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <rect x="64" y="56" width="1072" height="58" rx="22" fill="#FFFFFF" fill-opacity="0.03"/>
  <rect x="64" y="100" width="1072" height="14" fill="#0E1531"/>
  <circle cx="98" cy="85" r="6" fill="#FF5F57" fill-opacity="0.7"/>
  <circle cx="120" cy="85" r="6" fill="#FEBC2E" fill-opacity="0.7"/>
  <circle cx="142" cy="85" r="6" fill="#28C840" fill-opacity="0.7"/>
  <rect x="178" y="76" width="190" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.07"/>

  <!-- Chap ustun: jonli qo'ng'iroqlar navbati -->
  <text x="104" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="700" fill="#EAEEFB">Navbatdagi qo'ng'iroqlar</text>
  <circle cx="336" cy="152" r="5" fill="#34D399"/>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <!-- Qator 1 — javob berilmoqda -->
    <rect x="96" y="178" width="452" height="66" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#34D399" stroke-opacity="0.35"/>
    <circle cx="130" cy="211" r="17" fill="#34D399" fill-opacity="0.16"/>
    <path d="M123 205c0-1 1-2 2-2h4l3 6-3 2c1 3 3 5 6 6l2-3 6 3v4c0 1-1 2-2 2-8 0-18-10-18-18z" fill="#34D399"/>
    <text x="162" y="205" font-size="15" font-weight="600" fill="#EAEEFB">+998 90 123-45-67</text>
    <text x="162" y="227" font-size="13" fill="#A7B0D0">Aziza — savdo bo'limi</text>
    <text x="516" y="217" font-size="14" font-weight="700" fill="#34D399" text-anchor="end">01:24</text>

    <!-- Qator 2 — kutmoqda -->
    <rect x="96" y="256" width="452" height="66" rx="14" fill="#FFFFFF" fill-opacity="0.04"/>
    <circle cx="130" cy="289" r="17" fill="#F8DA00" fill-opacity="0.14"/>
    <circle cx="130" cy="289" r="9" fill="none" stroke="#FFE44D" stroke-width="2"/>
    <path d="M130 284v5l3 3" stroke="#FFE44D" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="162" y="283" font-size="15" font-weight="600" fill="#EAEEFB">+998 93 555-22-11</text>
    <text x="162" y="305" font-size="13" fill="#A7B0D0">Navbatda — 2-o'rin</text>
    <text x="516" y="295" font-size="14" font-weight="700" fill="#FFE44D" text-anchor="end">00:18</text>

    <!-- Qator 3 — kutmoqda -->
    <rect x="96" y="334" width="452" height="66" rx="14" fill="#FFFFFF" fill-opacity="0.04"/>
    <circle cx="130" cy="367" r="17" fill="#F8DA00" fill-opacity="0.14"/>
    <circle cx="130" cy="367" r="9" fill="none" stroke="#FFE44D" stroke-width="2"/>
    <path d="M130 362v5l3 3" stroke="#FFE44D" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="162" y="361" font-size="15" font-weight="600" fill="#EAEEFB">+998 91 777-88-99</text>
    <text x="162" y="383" font-size="13" fill="#A7B0D0">Navbatda — 3-o'rin</text>
    <text x="516" y="373" font-size="14" font-weight="700" fill="#FFE44D" text-anchor="end">00:06</text>

    <!-- Qator 4 — o'tkazib yuborilgan, qayta qo'ng'iroq -->
    <rect x="96" y="412" width="452" height="66" rx="14" fill="#FFFFFF" fill-opacity="0.04"/>
    <circle cx="130" cy="445" r="17" fill="#F87171" fill-opacity="0.14"/>
    <path d="M123 439l14 12M137 439l-14 12" stroke="#F87171" stroke-width="2" stroke-linecap="round"/>
    <text x="162" y="439" font-size="15" font-weight="600" fill="#EAEEFB">+998 94 300-10-20</text>
    <text x="162" y="461" font-size="13" fill="#A7B0D0">O'tkazib yuborilgan — qayta aloqa</text>
    <rect x="452" y="432" width="82" height="26" rx="13" fill="#5B5BF5" fill-opacity="0.22"/>
    <text x="493" y="450" font-size="12" font-weight="700" fill="#A5B4FC" text-anchor="middle">Qo'ng'iroq</text>
  </g>

  <!-- O'ng ustun: kunlik ko'rsatkichlar -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <text x="596" y="158" font-size="17" font-weight="700" fill="#EAEEFB">Bugungi ko'rsatkichlar</text>

    <rect x="588" y="178" width="240" height="92" rx="16" fill="#FFFFFF" fill-opacity="0.05"/>
    <text x="608" y="208" font-size="13" fill="#A7B0D0">Qabul qilingan</text>
    <text x="608" y="248" font-size="32" font-weight="800" fill="#EAEEFB">184</text>

    <rect x="844" y="178" width="240" height="92" rx="16" fill="#FFFFFF" fill-opacity="0.05"/>
    <text x="864" y="208" font-size="13" fill="#A7B0D0">O'tkazib yuborilgan</text>
    <text x="864" y="248" font-size="32" font-weight="800" fill="#F87171">7</text>

    <rect x="588" y="282" width="240" height="92" rx="16" fill="#FFFFFF" fill-opacity="0.05"/>
    <text x="608" y="312" font-size="13" fill="#A7B0D0">O'rtacha kutish</text>
    <text x="608" y="352" font-size="32" font-weight="800" fill="#EAEEFB">0:12</text>

    <rect x="844" y="282" width="240" height="92" rx="16" fill="#FFFFFF" fill-opacity="0.05"/>
    <text x="864" y="312" font-size="13" fill="#A7B0D0">Yozib olingan</text>
    <text x="864" y="352" font-size="32" font-weight="800" fill="#34D399">100%</text>

    <!-- Soatlik yuklama diagrammasi -->
    <text x="596" y="412" font-size="14" font-weight="600" fill="#A7B0D0">Soat bo'yicha yuklama</text>
    <rect x="596" y="438" width="30" height="26" rx="6" fill="url(#cc-bar)" opacity="0.55"/>
    <rect x="642" y="424" width="30" height="40" rx="6" fill="url(#cc-bar)" opacity="0.65"/>
    <rect x="688" y="404" width="30" height="60" rx="6" fill="url(#cc-bar)" opacity="0.75"/>
    <rect x="734" y="386" width="30" height="78" rx="6" fill="#5B5BF5"/>
    <rect x="780" y="396" width="30" height="68" rx="6" fill="url(#cc-bar)" opacity="0.8"/>
    <rect x="826" y="414" width="30" height="50" rx="6" fill="url(#cc-bar)" opacity="0.7"/>
    <rect x="872" y="430" width="30" height="34" rx="6" fill="url(#cc-bar)" opacity="0.6"/>
    <rect x="918" y="420" width="30" height="44" rx="6" fill="url(#cc-bar)" opacity="0.68"/>
    <rect x="964" y="442" width="30" height="22" rx="6" fill="url(#cc-bar)" opacity="0.5"/>
    <rect x="1010" y="450" width="30" height="14" rx="6" fill="url(#cc-bar)" opacity="0.45"/>
    <rect x="1054" y="446" width="30" height="18" rx="6" fill="url(#cc-bar)" opacity="0.45"/>
    <line x1="596" y1="470" x2="1084" y2="470" stroke="#FFFFFF" stroke-opacity="0.10"/>
  </g>

  <!-- Pastki lenta: Asterisk -->
  <rect x="96" y="510" width="988" height="70" rx="16" fill="#F8DA00" fill-opacity="0.07" stroke="#F8DA00" stroke-opacity="0.22"/>
  <circle cx="140" cy="545" r="18" fill="#F8DA00" fill-opacity="0.16"/>
  <path d="M133 538c0-1 1-2 2-2h4l3 6-3 2c1 3 3 5 6 6l2-3 6 3v4c0 1-1 2-2 2-9 0-18-10-18-18z" fill="#FFE44D"/>
  <text x="172" y="540" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#EAEEFB">Asterisk asosida qurilgan IP-telefoniya</text>
  <text x="172" y="562" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#A7B0D0">Har bir qo'ng'iroq yoziladi, hech biri javobsiz qolmaydi</text>
</svg>
