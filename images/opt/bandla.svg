<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Bandla — mijoz Telegram botda bron qiladi, biznes «Bugun» ekranida tasdiqlaydi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1026"/>
      <stop offset="1" stop-color="#121B3E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#1F4FD1" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1F4FD1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101937"/>
      <stop offset="1" stop-color="#0C122B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>

  <!-- ============ Chapda: telefon, mijoz boti ============ -->
  <g transform="translate(150 42)">
    <!-- korpus -->
    <rect width="300" height="600" rx="40" fill="#060A18" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
    <rect x="10" y="10" width="280" height="580" rx="32" fill="url(#phone)"/>
    <rect x="110" y="18" width="80" height="20" rx="10" fill="#060A18"/>

    <!-- chat sarlavhasi -->
    <g transform="translate(26 54)">
      <circle cx="18" cy="18" r="18" fill="#1F4FD1"/>
      <rect x="9" y="11" width="18" height="15" rx="3" fill="#FFFFFF"/>
      <rect x="9" y="11" width="18" height="4" rx="2" fill="#E8EEFC"/>
      <path d="M13.5 20.5 16.5 23.5 22.5 17" fill="none" stroke="#F2A93B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="15" font-family="Manrope, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#EEF1FB">Bandla</text>
      <text x="46" y="31" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#6F7AA0">bot</text>
    </g>
    <line x1="10" y1="104" x2="290" y2="104" stroke="rgba(255,255,255,0.08)"/>

    <!-- bot xabari: tanlangan bron -->
    <g transform="translate(26 122)">
      <rect width="226" height="150" rx="16" fill="#182454"/>
      <g font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#A7B0D0">
        <text x="16" y="28" font-family="Manrope, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#EEF1FB">Barber Lux</text>
        <text x="16" y="48">Chilonzor, 12-kvartal</text>
        <text x="16" y="78" fill="#EEF1FB">Soch olish · 45 daq</text>
        <text x="16" y="98" fill="#EEF1FB">Usta: Alisher</text>
        <text x="16" y="118" fill="#EEF1FB">Bugun, 18:30</text>
        <text x="16" y="138" font-weight="600" fill="#F2A93B">80 000 so'm</text>
      </g>
    </g>

    <!-- tugmalar -->
    <g transform="translate(26 286)" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      <rect width="226" height="40" rx="12" fill="#1F4FD1"/>
      <path d="M86 20 92 26 104 14" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="124" y="25" fill="#FFFFFF">Tasdiqlash</text>
      <rect y="48" width="226" height="40" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
      <text x="113" y="73" fill="#A7B0D0">Boshqa vaqt</text>
    </g>

    <!-- mijoz javobi -->
    <g transform="translate(118 392)">
      <rect width="134" height="36" rx="14" fill="#1F4FD1"/>
      <text x="67" y="23" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle">Tasdiqlash</text>
    </g>

    <!-- tasdiqlandi -->
    <g transform="translate(26 442)">
      <rect width="226" height="92" rx="16" fill="#182454"/>
      <circle cx="26" cy="26" r="11" fill="#34D399"/>
      <path d="M20 26 24.5 30.5 33 21" fill="none" stroke="#06241A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="31" font-family="Manrope, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#EEF1FB">Bron tasdiqlandi</text>
      <text x="16" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#A7B0D0">Bugun 18:30 · Usta Alisher</text>
      <text x="16" y="76" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#A7B0D0">2 soat oldin eslatamiz</text>
    </g>

    <!-- pastki yozuv maydoni -->
    <rect x="26" y="552" width="248" height="30" rx="15" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)"/>
  </g>

  <!-- ============ O'ngda: biznesning «Bugun» ekrani ============ -->
  <g transform="translate(520 96)">
    <rect width="560" height="484" rx="22" fill="#0E1531" stroke="rgba(255,255,255,0.10)"/>

    <text x="34" y="52" font-family="Manrope, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#EEF1FB">Bugun</text>
    <text x="34" y="76" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#6F7AA0">Seshanba, 14-oktabr · 9 ta bron</text>
    <rect x="34" y="88" width="52" height="3" rx="1.5" fill="#34D399"/>

    <!-- yangi so'rov -->
    <g transform="translate(410 36)">
      <rect width="116" height="30" rx="15" fill="rgba(242,169,59,0.16)" stroke="rgba(242,169,59,0.4)"/>
      <circle cx="18" cy="15" r="4" fill="#F2A93B"/>
      <text x="32" y="20" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#F2A93B">1 ta yangi</text>
    </g>

    <!-- qatorlar -->
    <g font-family="Inter, Segoe UI, sans-serif" font-size="14">
      <!-- 1 -->
      <g transform="translate(34 116)">
        <rect width="492" height="64" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)"/>
        <text x="18" y="38" font-family="Manrope, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#EEF1FB">10:00</text>
        <text x="86" y="29" fill="#EEF1FB">Jasur K.</text>
        <text x="86" y="48" font-size="12" fill="#6F7AA0">Soch + soqol · Usta Alisher</text>
        <rect x="392" y="20" width="82" height="24" rx="12" fill="rgba(52,211,153,0.14)"/>
        <text x="433" y="37" font-size="12" font-weight="600" fill="#34D399" text-anchor="middle">Keldi</text>
      </g>
      <!-- 2 -->
      <g transform="translate(34 190)">
        <rect width="492" height="64" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)"/>
        <text x="18" y="38" font-family="Manrope, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#EEF1FB">11:30</text>
        <text x="86" y="29" fill="#EEF1FB">Bekzod T.</text>
        <text x="86" y="48" font-size="12" fill="#6F7AA0">Soch olish · Usta Sardor</text>
        <rect x="372" y="20" width="102" height="24" rx="12" fill="rgba(31,79,209,0.25)"/>
        <text x="423" y="37" font-size="12" font-weight="600" fill="#9DB4F5" text-anchor="middle">Tasdiqlangan</text>
      </g>
      <!-- 3: yangi so'rov, tugmalar -->
      <g transform="translate(34 264)">
        <rect width="492" height="92" rx="14" fill="rgba(242,169,59,0.07)" stroke="rgba(242,169,59,0.35)"/>
        <text x="18" y="38" font-family="Manrope, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#EEF1FB">18:30</text>
        <text x="86" y="29" fill="#EEF1FB">Aziz R.</text>
        <text x="86" y="48" font-size="12" fill="#6F7AA0">Soch olish · Usta Alisher · botdan</text>
        <rect x="86" y="58" width="112" height="26" rx="8" fill="#34D399"/>
        <text x="142" y="76" font-size="12" font-weight="700" fill="#06241A" text-anchor="middle">Tasdiqlash</text>
        <rect x="206" y="58" width="96" height="26" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
        <text x="254" y="76" font-size="12" font-weight="600" fill="#A7B0D0" text-anchor="middle">Rad etish</text>
      </g>
      <!-- 4 -->
      <g transform="translate(34 366)">
        <rect width="492" height="64" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)"/>
        <text x="18" y="38" font-family="Manrope, Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#EEF1FB">19:30</text>
        <text x="86" y="29" fill="#EEF1FB">Doston M.</text>
        <text x="86" y="48" font-size="12" fill="#6F7AA0">Bolalar sochi · Usta Sardor</text>
        <rect x="372" y="20" width="102" height="24" rx="12" fill="rgba(31,79,209,0.25)"/>
        <text x="423" y="37" font-size="12" font-weight="600" fill="#9DB4F5" text-anchor="middle">Tasdiqlangan</text>
      </g>
    </g>

    <!-- pastki tab bar -->
    <g transform="translate(34 448)" font-family="Inter, Segoe UI, sans-serif" font-size="12" text-anchor="middle">
      <rect width="492" height="2" fill="rgba(255,255,255,0.07)"/>
      <text x="62" y="24" font-weight="600" fill="#EEF1FB">Bugun</text>
      <text x="185" y="24" fill="#6F7AA0">Jadval</text>
      <text x="308" y="24" fill="#6F7AA0">Profil</text>
      <text x="431" y="24" fill="#6F7AA0">Sozlamalar</text>
    </g>
  </g>

</svg>
