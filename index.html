  <body>
    <a class="skip-link" href="#main">Asosiy kontentga o'tish</a>

    <header class="site-header" id="siteHeader"></header>

    <main id="main">
      <!-- ============ HERO ============ -->
      <section class="hero">
        <div class="container hero__grid">
          <div class="stack stack-6 reveal">
            <span class="eyebrow" data-i18n="home.hero.eyebrow">Biznesni avtomatlashtirish</span>

            <h1 class="hero__title">
              <span data-i18n="home.hero.titleLead">Korxonangizni</span>
              <em data-i18n="home.hero.titleAccent">raqamli</em>
              <span data-i18n="home.hero.titleTail">boshqaruvga o'tkazing</span>
            </h1>

            <p class="lead" style="max-width: 56ch" data-i18n="home.hero.text"></p>

            <div class="hero__actions">
              <a class="btn btn--primary btn--lg" href="pricing.html" data-i18n="ui.tariffsCta">Tariflarni ko'rish</a>
              <a class="btn btn--ghost btn--lg" href="order.html" data-i18n="ui.consultCta">Bepul konsultatsiya</a>
            </div>

            <div class="hero__stats" id="heroStats"></div>
          </div>

          <div class="reveal">
            <div class="mockup">
              <div class="mockup__bar">
                <span class="mockup__dot"></span>
                <span class="mockup__dot"></span>
                <span class="mockup__dot"></span>
                <span class="mockup__url">app.tinch.uz</span>
              </div>
              <picture>
                <source srcset="./images/opt/hero-dashboard.webp" type="image/webp" />
                <img
                  src="./images/opt/hero-dashboard.jpg"
                  alt="Tinch boshqaruv paneli — biznes ko'rsatkichlari va hisobotlar"
                  width="1600"
                  height="1000"
                  fetchpriority="high"
                  decoding="async"
                />
              </picture>
              <span class="mockup__glow"></span>
            </div>
          </div>
        </div>
      </section>

      <!-- ============ MAHSULOTLAR ============ -->
      <section class="section" id="products">
        <div class="container">
          <div class="section-head reveal">
            <span class="eyebrow" data-i18n="home.productsSection.eyebrow">Mahsulotlar</span>
            <h2 class="h2" data-i18n="home.productsSection.title"></h2>
            <p class="lead" data-i18n="home.productsSection.text"></p>
          </div>

          <div class="grid grid--3" id="productGrid"></div>
        </div>
      </section>

      <!-- ============ NEGA BIZ ============ -->
      <section class="section" id="why">
        <div class="container">
          <div class="section-head reveal">
            <span class="eyebrow" data-i18n="home.whySection.eyebrow">Nega TINCH SOFT</span>
            <h2 class="h2" data-i18n="home.whySection.title"></h2>
          </div>

          <div class="grid grid--3" id="whyGrid"></div>
        </div>
      </section>

      <!-- ============ JARAYON ============ -->
      <section class="section section--tight" id="process">
        <div class="container">
          <div class="section-head reveal">
            <span class="eyebrow" data-i18n="home.processSection.eyebrow">Qanday ishlaymiz</span>
            <h2 class="h2" data-i18n="home.processSection.title"></h2>
          </div>

          <div class="steps" id="stepsGrid"></div>
        </div>
      </section>

      <!-- ============ CTA ============ -->
      <section class="section section--tight">
        <div class="container">
          <div class="cta-band reveal">
            <div class="cta-band__text stack stack-3">
              <h2 class="h3" data-i18n="home.ctaSection.title"></h2>
              <p class="muted" data-i18n="home.ctaSection.text"></p>
            </div>
            <div class="cta-band__actions">
              <a class="btn btn--primary btn--lg" href="order.html" data-i18n="ui.orderCta">Buyurtma berish</a>
              <a class="btn btn--ghost btn--lg" href="contacts.html" data-i18n="ui.contactCta">Bog'lanish</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="siteFooter"></footer>
